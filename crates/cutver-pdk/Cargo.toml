# Shared wire-contract DTOs for Cutver plugins. Kept dependency-light on purpose:
# a plugin compiles this crate to `wasm32-wasip1`, and every added dependency is
# bytes shipped inside every plugin binary.
[package]
name = "cutver-pdk"
version = "0.1.0"
description = "Shared request and response DTOs for Cutver plugins."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
